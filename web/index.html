<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YaoYoroZu — 顔加工MVP</title>
<link rel="stylesheet" href="./style.css" />

<div id="app">
  <header>
    <h1>YaoYoroZu <span>顔加工MVP</span></h1>
    <p class="sub">カメラ映像をリアルタイムで「可愛く＋少し違う顔」に変換します。この加工済み映像がWebRTC通話に流れます。</p>
  </header>

  <div class="stage">
    <div class="view">
      <video id="input" playsinline muted></video>
      <canvas id="output"></canvas>
      <div id="status" class="status">「カメラ開始」を押してください</div>
      <div class="fps" id="fps"></div>
    </div>

    <aside class="panel">
      <div class="row">
        <button id="startBtn" class="primary">カメラ開始</button>
        <button id="compareBtn" class="ghost" disabled>加工前と比較（長押し）</button>
      </div>

      <label>美肌 <output id="smoothOut">0.50</output>
        <input id="smooth" type="range" min="0" max="1" step="0.01" value="0.50" />
      </label>
      <label>明るさ・血色 <output id="brightOut">0.28</output>
        <input id="bright" type="range" min="0" max="1" step="0.01" value="0.28" />
      </label>
      <label>目を大きく <output id="eyeOut">0.18</output>
        <input id="eye" type="range" min="0" max="0.5" step="0.01" value="0.18" />
      </label>
      <label>輪郭スリム <output id="slimOut">0.15</output>
        <input id="slim" type="range" min="0" max="0.5" step="0.01" value="0.15" />
      </label>
      <label>モザイク（顔だけ・匿名） <output id="mosaicOut">0.00</output>
        <input id="mosaic" type="range" min="0" max="1" step="0.01" value="0.00" />
      </label>

      <div class="presets">
        <span>プリセット:</span>
        <button data-preset="natural" class="ghost">ナチュラル</button>
        <button data-preset="beauty" class="ghost">美人</button>
        <button data-preset="strong" class="ghost">しっかり</button>
      </div>

      <p class="note">
        美肌と明るさで肌をきれいに、目・輪郭は<strong>控えめ</strong>に整えます。加工は<strong>顔の内側だけ</strong>に効くので背景は歪みません。「モザイク」は顔だけをぼかす匿名モード。映像は自撮り用に左右反転（ミラー）表示です。
      </p>
    </aside>
  </div>
</div>

<script type="module" src="./app.js"></script>
