<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YaoYoroZu — 顔加工MVP</title>
<link rel="stylesheet" href="./style.css" />

<div id="app">
  <header>
    <h1>YaoYoroZu <span>顔加工MVP・メッシュ変形版</span></h1>
    <p class="sub">実写の顔をパーツ単位でリアルに変更します。目・鼻・口・あご・頬をそれぞれ独立に調整でき、背景は動きません。この加工済み映像がWebRTC通話に流れます。</p>
  </header>

  <div class="stage">
    <div class="view">
      <video id="input" playsinline muted></video>
      <canvas id="output"></canvas>
      <div id="status" class="status">「カメラ開始」を押してください</div>
      <div class="fps" id="fps"></div>
    </div>

    <aside class="panel">
      <div class="row">
        <button id="startBtn" class="primary">カメラ開始</button>
        <button id="compareBtn" class="ghost" disabled>加工前と比較（長押し）</button>
      </div>

      <div class="presets">
        <span>プリセット:</span>
        <button data-preset="natural" class="ghost">ナチュラル</button>
        <button data-preset="beauty" class="ghost">美人</button>
        <button data-preset="another" class="ghost">別人寄り</button>
        <button data-preset="reset" class="ghost">リセット</button>
      </div>

      <h3 class="grp">肌</h3>
      <label>美肌 <output id="smoothOut">0.50</output>
        <input id="smooth" type="range" min="0" max="1" step="0.01" value="0.50" /></label>
      <label>明るさ・血色 <output id="brightOut">0.28</output>
        <input id="bright" type="range" min="0" max="1" step="0.01" value="0.28" /></label>
      <label>モザイク（顔だけ・匿名） <output id="mosaicOut">0.00</output>
        <input id="mosaic" type="range" min="0" max="1" step="0.01" value="0" /></label>

      <h3 class="grp">目</h3>
      <label>大きさ <output id="eyeSizeOut">0.12</output>
        <input id="eyeSize" type="range" min="-0.2" max="0.4" step="0.01" value="0.12" /></label>
      <label>間隔（＋で離す） <output id="eyeSpaceOut">0.00</output>
        <input id="eyeSpace" type="range" min="-0.15" max="0.15" step="0.01" value="0" /></label>
      <label>傾き（＋つり目 / −たれ目） <output id="eyeTiltOut">0</output>
        <input id="eyeTilt" type="range" min="-12" max="12" step="0.5" value="0" /></label>

      <h3 class="grp">鼻</h3>
      <label>幅（−で細く） <output id="noseWOut">-0.08</output>
        <input id="noseW" type="range" min="-0.35" max="0.35" step="0.01" value="-0.08" /></label>
      <label>長さ（＋で長く） <output id="noseLOut">0.00</output>
        <input id="noseL" type="range" min="-0.3" max="0.3" step="0.01" value="0" /></label>

      <h3 class="grp">口</h3>
      <label>唇の厚み <output id="lipFullOut">0.10</output>
        <input id="lipFull" type="range" min="-0.3" max="0.5" step="0.01" value="0.10" /></label>
      <label>口の幅 <output id="mouthWOut">0.00</output>
        <input id="mouthW" type="range" min="-0.25" max="0.25" step="0.01" value="0" /></label>

      <h3 class="grp">輪郭</h3>
      <label>あごの幅（＋で細く） <output id="jawWOut">0.12</output>
        <input id="jawW" type="range" min="-0.15" max="0.4" step="0.01" value="0.12" /></label>
      <label>あごの長さ <output id="chinLOut">0.00</output>
        <input id="chinL" type="range" min="-0.3" max="0.3" step="0.01" value="0" /></label>
      <label>頬の張り（＋で外へ） <output id="cheekOut">0.00</output>
        <input id="cheek" type="range" min="-0.25" max="0.25" step="0.01" value="0" /></label>
      <label>顔の長さ <output id="faceLOut">0.00</output>
        <input id="faceL" type="range" min="-0.12" max="0.12" step="0.01" value="0" /></label>

      <p class="note">
        顔の478点メッシュを三角形分割し、パーツごとに点を動かして再描画しています（SNOW／FaceAppの「顔整形」と同じ方式）。
        <strong>顔の外側は固定</strong>なので背景は歪みません。「別人寄り」で実写のまま変えられる限界を確認できます。映像は自撮り用に左右反転です。
      </p>
    </aside>
  </div>
</div>

<script type="module" src="./app.js"></script>
