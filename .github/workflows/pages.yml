name: Deploy MVP to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/video-call-payment-app-94mr8n
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # Pagesを自動で有効化（public化後に効く）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web        # web/ の中身をサイトのルートとして公開
      - id: deployment
        uses: actions/deploy-pages@v4
